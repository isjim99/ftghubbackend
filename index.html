<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FTG Hub</title>
<style>
:root{--orange:#ff6b00;--ink:#171717;--muted:#6b7280;--bg:#f4f4f5;--card:#fff}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:940px;margin:auto;padding:18px}.hero{background:var(--ink);color:#fff;border-radius:24px;padding:24px;display:flex;gap:18px;align-items:center}
.hero img{width:92px;height:92px;border-radius:20px}.brand{color:var(--orange);font-weight:1000;letter-spacing:.12em}
.hero h1{margin:4px 0 2px;font-size:36px}.hero p{margin:0;color:#d1d5db}.sponsor{margin-left:auto;border:0;border-radius:999px;padding:12px 18px;background:var(--orange);font-weight:900;cursor:pointer}
.card{background:var(--card);border:1px solid #e5e7eb;border-radius:18px;padding:18px;margin-top:16px}.muted{color:var(--muted)}.status{display:inline-block;background:#111827;color:#fff;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:900}
.scoregrid{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:center;text-align:center;margin-top:14px}.team{font-weight:900;font-size:20px}.score{font-size:58px;font-weight:1000;color:var(--orange);line-height:1}
.stats{margin-top:16px}.player{display:grid;grid-template-columns:1fr auto;gap:10px;padding:10px 0;border-top:1px solid #eee}.empty{padding:26px;text-align:center;color:#6b7280}
dialog{border:0;border-radius:18px;padding:24px;max-width:420px;width:90%}dialog::backdrop{background:#0008}
@media(max-width:640px){.hero{align-items:flex-start;flex-wrap:wrap}.sponsor{margin-left:0}.scoregrid{grid-template-columns:1fr}.score{font-size:48px}}
</style></head>
<body>
<div class="wrap">
<section class="hero"><img src="/mascot.svg" alt="FTG mascot placeholder"><div><div class="brand">FTG SPORTS</div><h1>THE HUB</h1><p>Scores, stats, and game-day results.</p></div><button class="sponsor" id="sponsorBtn">SPONSOR</button></section>
<section class="card" id="app"><div class="empty">Loading latest FTG game…</div></section>
</div>
<dialog id="sponsorModal"><h2 style="margin-top:0">FTG Sponsor</h2><p class="muted">Sponsor details go here.</p><button onclick="document.getElementById('sponsorModal').close()" style="padding:10px 14px;border:0;border-radius:10px;background:#171717;color:white;font-weight:800">Close</button></dialog>
<script>
const app=document.getElementById('app');document.getElementById('sponsorBtn').addEventListener('click',()=>document.getElementById('sponsorModal').showModal());
function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
async function load(){try{const r=await fetch('/api/latest',{cache:'no-store'});const d=await r.json();if(!r.ok)throw new Error(d.error||'Hub unavailable');const g=d.game;const rows=d.players.map(p=>({...p,team:p.side==='home'?g.home_team:g.away_team}));
app.innerHTML=`<div class="muted">${esc(g.event_name||'FTG Event')} ${g.division?'• '+esc(g.division):''} ${g.grade?'• '+esc(g.grade):''}</div><h2 style="margin:6px 0 0">Game ${esc(g.game_number)}</h2><div class="scoregrid"><div><div class="team">${esc(g.home_team)}</div><div class="score">${g.home_score}</div></div><div><span class="status">${esc(String(g.status||'FINAL').toUpperCase())}</span></div><div><div class="team">${esc(g.away_team)}</div><div class="score">${g.away_score}</div></div></div><div class="muted" style="text-align:center;margin-top:10px">${g.court?esc(g.court):''} ${g.game_date?'• '+esc(g.game_date):''}</div><div class="stats"><h3>Player Stats</h3>${rows.length?rows.map(p=>`<div class="player"><div><b>${esc(p.team)} #${esc(p.player_number)} ${esc(p.player_name)}</b></div><div>${p.pts} PTS · ${p.reb} REB · ${p.ast} AST</div></div>`).join(''):'<div class="muted">No player stats yet.</div>'}</div>`;
}catch(e){app.innerHTML=`<div class="empty"><b>FTG Hub is online.</b><br><br>${esc(e.message)}<br><span class="muted">Once a scorer publishes a game, it will appear here.</span></div>`;}}
load();setInterval(load,15000);
</script></body></html>
